<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카피바라 경주</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(180deg, #87CEAA 0%, #5DBF82 18%, #3DAA62 40%, #2E9050 60%, #1E7A3A 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── 정글 배경 레이어들 ── */

  /* 하늘 */
  .sky {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 38%;
    background: linear-gradient(180deg, #B5E8F0 0%, #87CEEA 50%, #A8D8B4 100%);
    z-index: 0;
  }

  /* 태양 */
  .sun {
    position: fixed;
    top: 28px;
    right: 80px;
    width: 72px;
    height: 72px;
    background: radial-gradient(circle at 40% 40%, #FFF176, #FFD700 50%, #FFA000);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255,220,0,0.7), 0 0 80px rgba(255,200,0,0.3);
    z-index: 1;
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100% { box-shadow: 0 0 40px rgba(255,220,0,0.7), 0 0 80px rgba(255,200,0,0.3); }
    50%      { box-shadow: 0 0 55px rgba(255,220,0,0.9), 0 0 110px rgba(255,200,0,0.5); }
  }

  /* 구름들 */
  .cloud {
    position: fixed;
    background: rgba(255,255,255,0.88);
    border-radius: 999px;
    z-index: 1;
    animation: cloudDrift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.88);
    border-radius: 50%;
  }
  .cloud-1 { width: 100px; height: 32px; top: 40px; left: -120px; animation-duration: 28s; }
  .cloud-1::before { width: 50px; height: 50px; top: -22px; left: 16px; }
  .cloud-1::after  { width: 36px; height: 36px; top: -14px; left: 48px; }

  .cloud-2 { width: 70px; height: 24px; top: 70px; left: -90px; animation-duration: 22s; animation-delay: -10s; opacity: 0.7; }
  .cloud-2::before { width: 36px; height: 36px; top: -16px; left: 12px; }
  .cloud-2::after  { width: 28px; height: 28px; top: -10px; left: 34px; }

  .cloud-3 { width: 130px; height: 36px; top: 20px; left: -150px; animation-duration: 35s; animation-delay: -18s; opacity: 0.6; }
  .cloud-3::before { width: 60px; height: 60px; top: -28px; left: 20px; }
  .cloud-3::after  { width: 44px; height: 44px; top: -18px; left: 62px; }

  @keyframes cloudDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 200px)); }
  }

  /* 배경 나무들 (뒤쪽) */
  .trees-back {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 65%;
    z-index: 2;
    pointer-events: none;
  }

  /* 앞쪽 잎사귀 */
  .leaf {
    position: fixed;
    z-index: 8;
    font-size: 3.5rem;
    pointer-events: none;
    opacity: 0.85;
  }
  .leaf-tl  { top: -10px; left: -10px;  transform: rotate(-20deg); font-size: 5rem; }
  .leaf-tr  { top: -10px; right: -10px; transform: rotate(20deg) scaleX(-1); font-size: 5rem; }
  .leaf-bl  { bottom: 0;  left: -8px;   transform: rotate(10deg);  font-size: 4.5rem; }
  .leaf-br  { bottom: 0;  right: -8px;  transform: rotate(-10deg) scaleX(-1); font-size: 4.5rem; }
  .leaf-ml  { top: 45%;  left: -14px;   transform: rotate(-5deg);  font-size: 4rem; }
  .leaf-mr  { top: 45%;  right: -14px;  transform: rotate(5deg) scaleX(-1); font-size: 4rem; }

  /* 지면 */
  .ground {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 22%;
    background: linear-gradient(180deg, #4CAF50 0%, #388E3C 40%, #2E7D32 100%);
    border-radius: 60% 60% 0 0 / 30px 30px 0 0;
    z-index: 3;
  }
  .ground-grass {
    position: fixed;
    bottom: 18%;
    left: 0; right: 0;
    height: 60px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 14px,
      rgba(100,220,80,0.5) 14px, rgba(100,220,80,0.5) 18px
    );
    z-index: 4;
    border-radius: 50% 50% 0 0 / 20px 20px 0 0;
  }

  /* 장식 꽃/버섯 */
  .deco {
    position: fixed;
    bottom: 18%;
    font-size: 1.6rem;
    z-index: 5;
    pointer-events: none;
    animation: decoBob 3s ease-in-out infinite;
  }
  .deco:nth-child(2) { animation-delay: -1s; }
  .deco:nth-child(3) { animation-delay: -2s; }
  @keyframes decoBob {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  /* 떠다니는 나뭇잎 */
  .falling-leaf {
    position: fixed;
    font-size: 1.4rem;
    z-index: 6;
    pointer-events: none;
    animation: leafFall linear infinite;
    opacity: 0.8;
  }
  @keyframes leafFall {
    0%   { transform: translateY(-40px) rotate(0deg)   translateX(0);     opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(100vh) rotate(360deg) translateX(40px);  opacity: 0; }
  }

  /* ── 메인 카드 ── */
  .main-card {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 20px;
  }

  /* 카피바라 마스코트 */
  .mascot-wrap {
    position: relative;
    margin-bottom: 8px;
  }
  .mascot {
    width: 210px;
    height: auto;
    display: block;
    filter: drop-shadow(0 10px 28px rgba(0,0,0,0.22));
    animation: mascotBounce 2.2s ease-in-out infinite;
  }
  @keyframes mascotBounce {
    0%,100% { transform: translateY(0)    rotate(-2deg); }
    30%     { transform: translateY(-14px) rotate(2deg); }
    60%     { transform: translateY(-6px)  rotate(-1deg); }
  }
  .sparkle-1 { animation: sparkleAnim 2s ease-in-out infinite; }
  .sparkle-2 { animation: sparkleAnim 2s ease-in-out infinite 0.9s; }
  .sparkle-3 { animation: sparkleAnim 2s ease-in-out infinite 1.6s; }
  @keyframes sparkleAnim {
    0%,100% { opacity: 0.2; }
    50%      { opacity: 1; }
  }

  /* 제목 */
  .title {
    font-size: 3rem;
    font-weight: 900;
    color: #fff;
    text-shadow:
      0 3px 0 rgba(0,0,0,0.18),
      0 6px 20px rgba(0,100,30,0.4);
    letter-spacing: -1px;
    margin-bottom: 6px;
    line-height: 1.1;
  }
  .title-sub {
    font-size: 1.05rem;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    margin-bottom: 36px;
    font-weight: 700;
  }

  /* 시작 버튼 */
  .btn-play {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 20px 52px;
    background: linear-gradient(135deg, #FFD740 0%, #FF9800 100%);
    border: none;
    border-radius: 999px;
    color: #5a3000;
    font-size: 1.35rem;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    text-decoration: none;
    box-shadow:
      0 6px 0 rgba(180,100,0,0.45),
      0 10px 30px rgba(255,160,0,0.4);
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: -0.5px;
    animation: btnPulse 2.5s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 6px 0 rgba(180,100,0,0.45), 0 10px 30px rgba(255,160,0,0.4); }
    50%      { box-shadow: 0 6px 0 rgba(180,100,0,0.45), 0 14px 44px rgba(255,160,0,0.65); }
  }
  .btn-play:hover  { transform: translateY(-3px); box-shadow: 0 9px 0 rgba(180,100,0,0.45), 0 16px 40px rgba(255,160,0,0.55); }
  .btn-play:active { transform: translateY(2px);  box-shadow: 0 3px 0 rgba(180,100,0,0.45), 0 6px 16px rgba(255,160,0,0.3); }

  /* 조연 카피바라들 */
  .side-capys {
    display: flex;
    gap: 28px;
    margin-top: 32px;
    opacity: 0.9;
  }
  .side-capy {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .side-capy span:first-child {
    font-size: 2.4rem;
    animation: sideBounce 2s ease-in-out infinite;
    display: block;
  }
  .side-capy:nth-child(2) span:first-child { animation-delay: -0.4s; }
  .side-capy:nth-child(3) span:first-child { animation-delay: -0.8s; }
  .side-capy:nth-child(4) span:first-child { animation-delay: -1.2s; }
  @keyframes sideBounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  .side-name {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.8);
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    background: rgba(0,0,0,0.18);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* 하단 문구 */
  .footer-text {
    margin-top: 28px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.65);
    font-weight: 700;
    text-shadow: 0 1px 6px rgba(0,0,0,0.2);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<!-- 배경 레이어들 -->
<div class="sky"></div>
<div class="sun"></div>
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>

<!-- 모서리 잎사귀 -->
<div class="leaf leaf-tl">🌿</div>
<div class="leaf leaf-tr">🌿</div>
<div class="leaf leaf-bl">🍃</div>
<div class="leaf leaf-br">🍃</div>
<div class="leaf leaf-ml">🌴</div>
<div class="leaf leaf-mr">🌴</div>

<!-- 떠다니는 나뭇잎 -->
<div class="falling-leaf" style="left:8%;  animation-duration:7s;  animation-delay:0s;">🍃</div>
<div class="falling-leaf" style="left:22%; animation-duration:9s;  animation-delay:-3s;">🌿</div>
<div class="falling-leaf" style="left:60%; animation-duration:11s; animation-delay:-5s;">🍃</div>
<div class="falling-leaf" style="left:80%; animation-duration:8s;  animation-delay:-1s;">🌿</div>
<div class="falling-leaf" style="left:45%; animation-duration:13s; animation-delay:-7s;">🍃</div>

<!-- 지면 -->
<div class="ground"></div>
<div class="ground-grass"></div>

<!-- 장식 -->
<div class="deco" style="left:5%;">🌸</div>
<div class="deco" style="left:14%;">🍄</div>
<div class="deco" style="left:78%;">🌺</div>
<div class="deco" style="left:88%;">🌸</div>
<div class="deco" style="left:50%;">🌼</div>

<!-- 메인 카드 -->
<div class="main-card">

  <!-- 마스코트 -->
  <div class="mascot-wrap">
    <svg class="mascot" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <!-- 그림자 -->
      <ellipse cx="100" cy="214" rx="48" ry="6" fill="rgba(0,0,0,0.13)"/>

      <!-- 몸통 -->
      <ellipse cx="100" cy="168" rx="54" ry="38" fill="#C8936A"/>
      <!-- 배 밝은 부분 -->
      <ellipse cx="100" cy="176" rx="36" ry="24" fill="#DBA878" opacity="0.45"/>

      <!-- 다리 -->
      <ellipse cx="64"  cy="197" rx="22" ry="13" fill="#B07848"/>
      <ellipse cx="136" cy="197" rx="22" ry="13" fill="#B07848"/>
      <!-- 발가락 -->
      <ellipse cx="54"  cy="205" rx="7" ry="4" fill="#9A6438"/>
      <ellipse cx="70"  cy="207" rx="7" ry="4" fill="#9A6438"/>
      <ellipse cx="126" cy="205" rx="7" ry="4" fill="#9A6438"/>
      <ellipse cx="142" cy="207" rx="7" ry="4" fill="#9A6438"/>

      <!-- 목 -->
      <ellipse cx="100" cy="134" rx="28" ry="20" fill="#C8936A"/>

      <!-- 머리 (크고 동그랗게) -->
      <ellipse cx="100" cy="90" rx="58" ry="54" fill="#D4A870"/>

      <!-- 귀 왼쪽 -->
      <ellipse cx="56"  cy="47" rx="17" ry="20" fill="#C0885A"/>
      <ellipse cx="56"  cy="49" rx="10" ry="13" fill="#F0B898"/>
      <!-- 귀 오른쪽 -->
      <ellipse cx="144" cy="47" rx="17" ry="20" fill="#C0885A"/>
      <ellipse cx="144" cy="49" rx="10" ry="13" fill="#F0B898"/>

      <!-- 주둥이 영역 -->
      <ellipse cx="100" cy="108" rx="38" ry="26" fill="#BC8050"/>

      <!-- 눈 왼쪽 -->
      <ellipse cx="74" cy="82" rx="21" ry="23" fill="white"/>
      <circle  cx="76" cy="84" r="15" fill="#140604"/>
      <circle  cx="76" cy="84" r="11" fill="#2A1208"/>
      <!-- 눈 빛 -->
      <circle cx="83" cy="76" r="6.5" fill="white"/>
      <circle cx="69" cy="91" r="3"   fill="rgba(255,255,255,0.88)"/>
      <circle cx="85" cy="89" r="2"   fill="rgba(255,255,255,0.7)"/>

      <!-- 눈 오른쪽 -->
      <ellipse cx="126" cy="82" rx="21" ry="23" fill="white"/>
      <circle  cx="128" cy="84" r="15" fill="#140604"/>
      <circle  cx="128" cy="84" r="11" fill="#2A1208"/>
      <!-- 눈 빛 -->
      <circle cx="135" cy="76" r="6.5" fill="white"/>
      <circle cx="121" cy="91" r="3"   fill="rgba(255,255,255,0.88)"/>
      <circle cx="137" cy="89" r="2"   fill="rgba(255,255,255,0.7)"/>

      <!-- 코 -->
      <ellipse cx="100" cy="106" rx="15" ry="9" fill="#7A3818"/>
      <ellipse cx="100" cy="103" rx="9"  ry="5" fill="#9A5028" opacity="0.75"/>
      <!-- 콧구멍 -->
      <ellipse cx="93.5"  cy="108" rx="3.5" ry="2.5" fill="#5A2810"/>
      <ellipse cx="106.5" cy="108" rx="3.5" ry="2.5" fill="#5A2810"/>

      <!-- 입 (귀여운 미소) -->
      <path d="M83 118 Q100 134 117 118" stroke="#7A3818" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- 볼터치 (양쪽) -->
      <ellipse cx="49"  cy="98" rx="18" ry="12" fill="rgba(255,80,110,0.32)"/>
      <ellipse cx="151" cy="98" rx="18" ry="12" fill="rgba(255,80,110,0.32)"/>

      <!-- 히비스커스 꽃 (오른쪽 귀 위) -->
      <g transform="translate(147,34)">
        <!-- 꽃잎 5장 -->
        <circle cx="0"     cy="-13"  r="9" fill="#FF7BAE"/>
        <circle cx="12.4"  cy="-4"   r="9" fill="#FF80B2"/>
        <circle cx="7.6"   cy="10.4" r="9" fill="#FF88B8"/>
        <circle cx="-7.6"  cy="10.4" r="9" fill="#FF88B8"/>
        <circle cx="-12.4" cy="-4"   r="9" fill="#FF7BAE"/>
        <!-- 꽃잎 안쪽 밝기 -->
        <circle cx="0" cy="-13" r="5" fill="#FFB0D4" opacity="0.5"/>
        <!-- 꽃 중심 -->
        <circle cx="0" cy="0" r="9" fill="#FFE44A"/>
        <circle cx="0" cy="0" r="6" fill="#FFD000"/>
        <!-- 수술 -->
        <circle cx="0"    cy="-5.5" r="2" fill="#FF8800"/>
        <circle cx="5.2"  cy="2.8"  r="2" fill="#FF8800"/>
        <circle cx="-5.2" cy="2.8"  r="2" fill="#FF8800"/>
      </g>

      <!-- 왕관 (머리 위) -->
      <g transform="translate(100,42)">
        <!-- 왕관 몸체 -->
        <polygon points="-22,10 -22,-4 -12,-14 0,-4 12,-14 22,-4 22,10" fill="#FFD740" stroke="#E5A500" stroke-width="1.5"/>
        <!-- 보석 -->
        <circle cx="0"   cy="-1" r="4.5" fill="#FF5C8D"/>
        <circle cx="-14" cy="3"  r="3"   fill="#7EC8FF"/>
        <circle cx="14"  cy="3"  r="3"   fill="#7EC8FF"/>
        <!-- 왕관 윗 점 빛 -->
        <circle cx="0"    cy="-1" r="2" fill="rgba(255,255,255,0.55)"/>
      </g>

      <!-- 반짝이 -->
      <g class="sparkle-1" transform="translate(20,76)">
        <line x1="0" y1="-11" x2="0" y2="11"  stroke="#FFE566" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-11" y1="0" x2="11" y2="0"  stroke="#FFE566" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-7" y1="-7" x2="7" y2="7"   stroke="#FFE566" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7" y1="-7" x2="-7" y2="7"   stroke="#FFE566" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g class="sparkle-2" transform="translate(180,106)">
        <line x1="0" y1="-8" x2="0" y2="8"    stroke="#FFE566" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="0" x2="8" y2="0"    stroke="#FFE566" stroke-width="2" stroke-linecap="round"/>
        <line x1="-5" y1="-5" x2="5" y2="5"   stroke="#FFE566" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="5" y1="-5" x2="-5" y2="5"   stroke="#FFE566" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="sparkle-3" transform="translate(168,60)">
        <line x1="0" y1="-6" x2="0" y2="6"    stroke="#FFF0A0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-6" y1="0" x2="6" y2="0"    stroke="#FFF0A0" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- 제목 -->
  <div class="title">카피바라 경주</div>
  <div class="title-sub">🌿 정글 속 느릿느릿 레이스 · 꼴등이 당첨! 🌿</div>

  <!-- 시작 버튼 -->
  <a href="game3.html" class="btn-play">
    🏁 경주 시작!
  </a>

  <!-- 조연 카피바라들 -->
  <div class="side-capys">
    <div class="side-capy">
      <span>🦫</span>
      <span class="side-name">선수 1</span>
    </div>
    <div class="side-capy">
      <span>🦫</span>
      <span class="side-name">선수 2</span>
    </div>
    <div class="side-capy">
      <span>🦫</span>
      <span class="side-name">선수 3</span>
    </div>
    <div class="side-capy">
      <span>🦫</span>
      <span class="side-name">선수 4</span>
    </div>
  </div>

  <div class="footer-text">가장 느리게 들어오는 카피바라 주인이 커피 담당 ☕</div>

</div>

</body>
</html>
