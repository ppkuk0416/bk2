<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통아저씨 게임</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #fff;
  }

  .back-btn {
    align-self: flex-start;
    padding: 8px 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 20px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.2); }

  h1 {
    font-size: 2rem;
    font-weight: 900;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 0.9rem;
    margin-bottom: 30px;
    text-align: center;
  }

  /* === Setup === */
  .setup-box {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 30px;
  }
  .setup-box h3 { font-size: 1rem; margin-bottom: 14px; color: rgba(255,255,255,0.8); }

  .name-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .name-inputs input {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
    min-width: 0;
  }
  .name-inputs input::placeholder { color: rgba(255,255,255,0.3); }
  .name-inputs input:focus { border-color: rgba(255,100,100,0.6); }

  .btn-start {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #ff4444, #ff6b6b);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-start:active { transform: translateY(0); }

  /* === Game Area === */
  #game-area { display: none; width: 100%; max-width: 600px; }

  .turn-info {
    text-align: center;
    margin-bottom: 20px;
  }
  .turn-info .current-player {
    font-size: 1.4rem;
    font-weight: 700;
    color: #ffdd44;
    margin-bottom: 4px;
  }
  .turn-info .hint {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
  }

  /* === Barrel SVG area === */
  .barrel-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px;
    position: relative;
  }

  .barrel-svg-container {
    position: relative;
    width: 320px;
    height: 360px;
  }

  /* Holes grid */
  .holes-grid {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 240px;
  }

  .hole-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.4);
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hole-btn:hover:not(.used) {
    border-color: rgba(255,100,100,0.8);
    background: rgba(255,50,50,0.2);
    transform: scale(1.1);
  }
  .hole-btn.used {
    cursor: not-allowed;
    opacity: 0.7;
  }
  .hole-btn.has-knife {
    border-color: rgba(200,150,50,0.8);
    background: rgba(200,150,50,0.15);
  }

  .knife-svg {
    width: 30px;
    height: 30px;
  }

  /* Barrel illustration */
  .barrel-body {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 270px;
    height: 260px;
  }

  /* Uncle on top */
  .uncle {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3.5rem;
    transition: all 0.1s;
    z-index: 10;
    cursor: default;
  }
  .uncle.hidden {
    top: 30px;
    opacity: 0;
    filter: blur(2px);
  }
  .uncle.pop {
    animation: pop-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes pop-up {
    0%   { top: 30px; opacity: 0; transform: translateX(-50%) scale(0.5) rotate(-10deg); }
    60%  { top: -30px; transform: translateX(-50%) scale(1.3) rotate(5deg); }
    100% { top: -20px; opacity: 1; transform: translateX(-50%) scale(1.1) rotate(0deg); }
  }

  .shake {
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(-50%); }
    20%     { transform: translateX(calc(-50% - 8px)); }
    40%     { transform: translateX(calc(-50% + 8px)); }
    60%     { transform: translateX(calc(-50% - 5px)); }
    80%     { transform: translateX(calc(-50% + 5px)); }
  }

  /* Player list */
  .players-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .player-chip {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 700;
    background: rgba(255,255,255,0.1);
    border: 2px solid transparent;
    transition: all 0.3s;
  }
  .player-chip.active {
    background: rgba(255,68,68,0.3);
    border-color: #ff4444;
    color: #ffaaaa;
  }
  .player-chip.out {
    opacity: 0.35;
    text-decoration: line-through;
  }

  /* Result overlay */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .result-overlay.show { display: flex; }

  @keyframes result-pop {
    0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    60%  { transform: scale(1.35) rotate(8deg); }
    100% { opacity: 1; transform: scale(1.1) rotate(0deg); }
  }
  .result-emoji { font-size: 6rem; margin-bottom: 20px; animation: result-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  .result-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; color: #ff4444; }
  .result-name  { font-size: 1.8rem; font-weight: 700; color: #ffdd44; margin-bottom: 30px; }

  .btn-restart {
    padding: 14px 40px;
    background: linear-gradient(90deg, #ff4444, #ff6b6b);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    margin-top: 10px;
  }
</style>
</head>
<body>

<a href="index.html" class="back-btn">← 홈으로</a>
<h1>🗡️ 통아저씨 게임</h1>
<p class="subtitle">칼을 꽂다가 통아저씨가 튀어나오면 당첨!</p>

<!-- Setup -->
<div class="setup-box" id="setup-box">
  <h3>참가자 이름 입력 (최소 2명, 최대 8명)</h3>
  <div class="name-inputs">
    <input type="text" placeholder="1번 참가자" id="p1" value="">
    <input type="text" placeholder="2번 참가자" id="p2" value="">
    <input type="text" placeholder="3번 참가자" id="p3" value="">
    <input type="text" placeholder="4번 참가자" id="p4" value="">
    <input type="text" placeholder="5번 참가자" id="p5" value="">
    <input type="text" placeholder="6번 참가자" id="p6" value="">
    <input type="text" placeholder="7번 참가자" id="p7" value="">
    <input type="text" placeholder="8번 참가자" id="p8" value="">
  </div>
  <button class="btn-start" onclick="startGame()">게임 시작!</button>
</div>

<!-- Game -->
<div id="game-area">
  <div class="turn-info">
    <div class="current-player" id="current-player-name">?</div>
    <div class="hint">칼을 꽂을 구멍을 선택하세요</div>
  </div>

  <div class="players-list" id="players-list"></div>

  <div class="barrel-wrap">
    <div class="barrel-svg-container" id="barrel-container">

      <!-- Uncle -->
      <div class="uncle hidden" id="uncle">🧔</div>

      <!-- Barrel SVG -->
      <svg class="barrel-body" viewBox="0 0 270 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Main barrel body -->
        <ellipse cx="135" cy="240" rx="110" ry="18" fill="#5C3317" opacity="0.6"/>
        <rect x="30" y="60" width="210" height="185" rx="20" fill="#8B5E3C"/>
        <rect x="30" y="60" width="210" height="185" rx="20" fill="url(#woodGrain)"/>
        <!-- Barrel bands -->
        <rect x="24" y="90"  width="222" height="14" rx="7" fill="#5C3317"/>
        <rect x="24" y="155" width="222" height="14" rx="7" fill="#5C3317"/>
        <rect x="24" y="220" width="222" height="14" rx="7" fill="#5C3317"/>
        <!-- Top ellipse -->
        <ellipse cx="135" cy="62" rx="105" ry="22" fill="#A0703A"/>
        <ellipse cx="135" cy="58" rx="95"  ry="18" fill="#B8854A"/>
        <!-- Highlight -->
        <rect x="42" y="70"  width="8"  height="170" rx="4" fill="rgba(255,255,255,0.12)"/>
        <defs>
          <linearGradient id="woodGrain" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="rgba(0,0,0,0.15)"/>
            <stop offset="20%"  stop-color="rgba(255,255,255,0.05)"/>
            <stop offset="80%"  stop-color="rgba(255,255,255,0.05)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.2)"/>
          </linearGradient>
        </defs>
      </svg>

      <!-- Holes grid -->
      <div class="holes-grid" id="holes-grid"></div>

    </div>
  </div>
</div>

<!-- Result overlay -->
<div class="result-overlay" id="result-overlay">
  <div class="result-emoji">💀</div>
  <div class="result-title">당첨!</div>
  <div class="result-name" id="result-loser-name"></div>
  <div style="color:rgba(255,255,255,0.6); font-size:1rem;">커피 한 잔 사야겠는데요? ☕</div>
  <button class="btn-restart" onclick="resetGame()">다시 하기</button>
  <a href="index.html" style="display:block; margin-top:14px; color:rgba(255,255,255,0.4); font-size:0.9rem; text-decoration:none;">홈으로 돌아가기</a>
</div>

<script>
  let players = [];
  let currentIndex = 0;
  let totalHoles = 16;
  let bombHole = -1;
  let usedHoles = new Set();

  function startGame() {
    const inputs = document.querySelectorAll('.name-inputs input');
    players = [];
    inputs.forEach(inp => {
      const v = inp.value.trim();
      if (v) players.push({ name: v, out: false });
    });

    if (players.length < 2) {
      alert('최소 2명의 이름을 입력해주세요!');
      return;
    }

    document.getElementById('setup-box').style.display = 'none';
    document.getElementById('game-area').style.display = 'block';

    initBarrel();
    renderPlayers();
    updateTurn();
  }

  function initBarrel() {
    // Choose random bomb hole
    bombHole = Math.floor(Math.random() * totalHoles);
    usedHoles.clear();

    const grid = document.getElementById('holes-grid');
    grid.innerHTML = '';

    for (let i = 0; i < totalHoles; i++) {
      const btn = document.createElement('button');
      btn.className = 'hole-btn';
      btn.id = `hole-${i}`;
      btn.onclick = () => stab(i, btn);
      btn.title = `구멍 ${i + 1}`;
      // Show hole number subtly
      btn.innerHTML = `<span style="color:rgba(255,255,255,0.3);font-size:0.7rem;">${i+1}</span>`;
      grid.appendChild(btn);
    }

    document.getElementById('uncle').className = 'uncle hidden';
  }

  function renderPlayers() {
    const list = document.getElementById('players-list');
    list.innerHTML = '';
    players.forEach((p, i) => {
      const chip = document.createElement('div');
      chip.className = 'player-chip' + (p.out ? ' out' : '');
      chip.id = `chip-${i}`;
      chip.textContent = p.name;
      list.appendChild(chip);
    });
  }

  function updateTurn() {
    // Find active players
    const active = players.filter(p => !p.out);
    if (active.length === 0) return;

    // currentIndex wraps among active
    while (players[currentIndex].out) {
      currentIndex = (currentIndex + 1) % players.length;
    }

    document.getElementById('current-player-name').textContent =
      players[currentIndex].name + '님의 차례';

    // Highlight
    players.forEach((p, i) => {
      const chip = document.getElementById(`chip-${i}`);
      if (!chip) return;
      chip.className = 'player-chip' +
        (p.out ? ' out' : '') +
        (i === currentIndex && !p.out ? ' active' : '');
    });
  }

  function stab(holeIndex, btn) {
    if (usedHoles.has(holeIndex)) return;
    usedHoles.add(holeIndex);

    btn.innerHTML = `<svg class="knife-svg" viewBox="0 0 40 40">
      <text y="28" font-size="26" text-anchor="middle" x="20">🗡️</text>
    </svg>`;
    btn.classList.add('used', 'has-knife');

    const barrel = document.getElementById('barrel-container');
    barrel.classList.add('shake');
    setTimeout(() => barrel.classList.remove('shake'), 400);

    if (holeIndex === bombHole) {
      // POP!
      setTimeout(() => {
        const uncle = document.getElementById('uncle');
        uncle.className = 'uncle pop';
        uncle.textContent = '🧔';
        setTimeout(() => showResult(), 600);
      }, 200);
    } else {
      // Next turn
      currentIndex = (currentIndex + 1) % players.length;
      // Skip out players
      let safety = 0;
      while (players[currentIndex].out && safety < players.length) {
        currentIndex = (currentIndex + 1) % players.length;
        safety++;
      }
      updateTurn();
    }
  }

  function showResult() {
    const loser = players[currentIndex];
    document.getElementById('result-loser-name').textContent = loser.name;
    document.getElementById('result-overlay').classList.add('show');
  }

  function resetGame() {
    document.getElementById('result-overlay').classList.remove('show');
    document.getElementById('setup-box').style.display = 'block';
    document.getElementById('game-area').style.display = 'none';
    document.querySelectorAll('.name-inputs input').forEach(i => i.value = '');
  }
</script>
</body>
</html>
