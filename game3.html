<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카피바라 경주</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #1a2e1a, #1a2e20, #0f3020);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #fff;
  }

  .back-btn {
    align-self: flex-start;
    padding: 8px 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 20px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.2); }

  h1 { font-size: 2rem; font-weight: 900; text-align: center; margin-bottom: 6px; }
  .subtitle { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 30px; text-align: center; }

  /* Setup */
  .setup-box {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 30px;
  }
  .setup-box h3 { font-size: 1rem; margin-bottom: 14px; color: rgba(255,255,255,0.8); }
  .name-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .name-inputs input {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
    min-width: 0;
  }
  .name-inputs input::placeholder { color: rgba(255,255,255,0.3); }
  .name-inputs input:focus { border-color: rgba(100,255,150,0.6); }

  .btn-start {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #44cc77, #66dd99);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Game area */
  #game-area { display: none; width: 100%; max-width: 760px; }

  .race-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .race-status {
    font-size: 1.3rem;
    font-weight: 700;
  }

  /* Track */
  .track-container {
    background: rgba(0,0,0,0.35);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }

  .track {
    position: relative;
    margin-bottom: 12px;
    height: 72px;
    display: flex;
    align-items: center;
  }
  .track:last-child { margin-bottom: 0; }

  .lane-bg {
    position: absolute;
    top: 4px;
    left: 90px;
    right: 0;
    bottom: 4px;
    border-radius: 10px;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 30px,
      rgba(255,255,255,0.06) 30px,
      rgba(255,255,255,0.06) 60px
    );
    border: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
  }

  .finish-line {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    background: repeating-linear-gradient(
      180deg,
      #fff 0px, #fff 6px,
      #333 6px, #333 12px
    );
    opacity: 0.4;
    border-radius: 0 10px 10px 0;
  }

  .player-label {
    position: absolute;
    left: 0;
    width: 85px;
    font-size: 0.8rem;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    text-align: right;
    padding-right: 10px;
    z-index: 2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .capybara-runner {
    position: absolute;
    left: 90px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.2rem;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
    /* No CSS transition – JS handles frame-by-frame animation */
  }

  .capybara-name-tag {
    font-size: 0.6rem;
    background: rgba(0,0,0,0.6);
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
    font-weight: 700;
    margin-top: 2px;
  }

  /* Dust particles */
  .dust-particle {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    top: 50%;
    font-size: 0.75rem;
    opacity: 0.9;
    animation: dustFade 0.65s ease-out forwards;
  }
  @keyframes dustFade {
    0%   { opacity: 0.9; transform: translateY(-50%) scale(1) translateX(0); }
    100% { opacity: 0;   transform: translateY(calc(-50% - 14px)) scale(0.3) translateX(-10px); }
  }

  /* Event bubble */
  .event-bubble {
    position: absolute;
    top: -10px;
    left: 50%;
    font-size: 0.68rem;
    font-weight: 700;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    background: rgba(0,0,0,0.72);
    padding: 2px 7px;
    border-radius: 8px;
    animation: bubblePop 1.5s ease-out forwards;
  }
  @keyframes bubblePop {
    0%   { opacity: 1; transform: translateX(-50%) translateY(0)    scale(1);   }
    15%  {             transform: translateX(-50%) translateY(-5px)  scale(1.12); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-22px) scale(0.8); }
  }

  /* Rank badge */
  .rank-badge {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 900;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .rank-badge.show { opacity: 1; }
  .rank-1  { background: #FFD700; color: #333; }
  .rank-2  { background: #C0C0C0; color: #333; }
  .rank-3  { background: #CD7F32; color: #fff; }
  .rank-4  { background: rgba(255,255,255,0.15); color: #fff; }
  .rank-5  { background: rgba(255,255,255,0.15); color: #fff; }
  .rank-6  { background: rgba(255,255,255,0.15); color: #fff; }
  .rank-7  { background: rgba(255,255,255,0.15); color: #fff; }
  .rank-8  { background: rgba(255,255,255,0.15); color: #fff; }

  /* Action btn */
  .action-btn {
    display: block;
    width: 100%;
    max-width: 300px;
    margin: 0 auto 16px;
    padding: 14px;
    background: linear-gradient(90deg, #44cc77, #66dd99);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: opacity 0.2s, transform 0.1s;
  }
  .action-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Arrival log */
  .arrival-log {
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.9;
    min-height: 40px;
  }

  /* Result overlay */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .result-overlay.show { display: flex; }

  .result-emoji { font-size: 6rem; margin-bottom: 20px; animation: popIn 0.6s forwards; }
  @keyframes popIn {
    0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
    70%  { transform: scale(1.2) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .result-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; color: #ff5555; }
  .result-name  { font-size: 2.2rem; font-weight: 900; color: #ffdd44; margin-bottom: 8px; }
  .result-sub   { color: rgba(255,255,255,0.5); font-size: 0.95rem; margin-bottom: 30px; }
  .result-order { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-bottom: 24px; line-height:1.8; }

  .btn-restart {
    padding: 14px 40px;
    background: linear-gradient(90deg, #44cc77, #66dd99);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* Countdown overlay */
  .countdown-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .countdown-overlay.show { display: flex; }
  .countdown-number {
    font-size: 9rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 40px rgba(100,255,150,0.8);
    animation: countPop 0.9s ease-out;
  }
  @keyframes countPop {
    0%   { transform: scale(2);   opacity: 0; }
    30%  { transform: scale(1);   opacity: 1; }
    80%  { transform: scale(1);   opacity: 1; }
    100% { transform: scale(0.6); opacity: 0; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-btn">← 홈으로</a>
<h1>🦫 카피바라 경주</h1>
<p class="subtitle">가장 느리게 들어오는 카피바라가 당첨!</p>

<!-- Setup -->
<div class="setup-box" id="setup-box">
  <h3>참가자 이름 입력 (2~8명)</h3>
  <div class="name-inputs">
    <input type="text" id="p1" placeholder="1번 참가자">
    <input type="text" id="p2" placeholder="2번 참가자">
    <input type="text" id="p3" placeholder="3번 참가자 (선택)">
    <input type="text" id="p4" placeholder="4번 참가자 (선택)">
    <input type="text" id="p5" placeholder="5번 참가자 (선택)">
    <input type="text" id="p6" placeholder="6번 참가자 (선택)">
    <input type="text" id="p7" placeholder="7번 참가자 (선택)">
    <input type="text" id="p8" placeholder="8번 참가자 (선택)">
  </div>
  <button class="btn-start" onclick="startRace()">경주 시작!</button>
</div>

<!-- Game -->
<div id="game-area">
  <div class="race-header">
    <div class="race-status" id="race-status">🏁 출발 준비!</div>
  </div>
  <div class="track-container" id="track-container"></div>
  <button class="action-btn" id="action-btn" onclick="beginCountdown()">🦫 출발!</button>
  <div class="arrival-log" id="arrival-log"></div>
</div>

<!-- Countdown overlay -->
<div class="countdown-overlay" id="countdown-overlay">
  <div class="countdown-number" id="countdown-number">3</div>
</div>

<!-- Result overlay -->
<div class="result-overlay" id="result-overlay">
  <div class="result-emoji">🦫</div>
  <div class="result-title">꼴등 당첨!</div>
  <div class="result-name" id="result-name"></div>
  <div class="result-sub">가장 느린 카피바라... 커피 사줘요 ☕</div>
  <div class="result-order" id="result-order"></div>
  <button class="btn-restart" onclick="resetRace()">다시 하기</button>
  <a href="index.html" style="display:block;margin-top:14px;color:rgba(255,255,255,0.4);font-size:0.9rem;text-decoration:none;">홈으로</a>
</div>

<script>
  const CAPYBARAS = ['🦫','🦫','🦫','🦫','🦫','🦫','🦫','🦫'];
  const COLORS = ['#FFD700','#FF6B6B','#44AAFF','#AA44FF','#FF9944','#44FFAA','#FF44AA','#44FFFF'];

  // Speed halved from original → race takes ~2x longer
  const BASE_SPEED_MIN = 0.0004;
  const BASE_SPEED_MAX = 0.0015;
  const SPEED_CAP_MAX  = 0.0022;
  const SPEED_CAP_MIN  = 0.00012;

  let players = [];
  let positions = [];
  let baseTargetSpeeds = [];
  let currentSpeeds = [];
  let speedEvents = [];   // null | { type:'burst'|'stumble', framesLeft }
  let finished = [];
  let running = false;
  let animFrameId = null;

  // ── Setup ──────────────────────────────────────────────
  function startRace() {
    const ids = ['p1','p2','p3','p4','p5','p6','p7','p8'];
    players = ids.map(id => document.getElementById(id).value.trim()).filter(Boolean);
    if (players.length < 2) { alert('최소 2명 입력해주세요!'); return; }

    document.getElementById('setup-box').style.display = 'none';
    document.getElementById('game-area').style.display = 'block';

    buildTracks();
    resetPositions();
    document.getElementById('action-btn').disabled = false;
    document.getElementById('action-btn').textContent = '🦫 출발!';
    document.getElementById('race-status').textContent = '🏁 출발 준비!';
    document.getElementById('arrival-log').innerHTML = '';
  }

  function buildTracks() {
    const container = document.getElementById('track-container');
    container.innerHTML = '';
    players.forEach((name, i) => {
      const track = document.createElement('div');
      track.className = 'track';
      track.id = `track-${i}`;
      track.innerHTML = `
        <div class="lane-bg"></div>
        <div class="finish-line"></div>
        <div class="player-label" style="color:${COLORS[i]}">${name}</div>
        <div class="capybara-runner" id="runner-${i}">
          <span class="cap-body">${CAPYBARAS[i]}</span>
          <div class="capybara-name-tag" style="color:${COLORS[i]}">${name}</div>
        </div>
        <div class="rank-badge rank-${i+1}" id="rank-${i}"></div>
      `;
      container.appendChild(track);
    });
  }

  function resetPositions() {
    positions         = players.map(() => 0);
    baseTargetSpeeds  = players.map(() => 0);
    currentSpeeds     = players.map(() => 0);
    speedEvents       = players.map(() => null);
    finished          = [];
    running           = false;
    players.forEach((_, i) => {
      setRunnerPos(i, 0);
      const body = document.getElementById(`runner-${i}`)?.querySelector('.cap-body');
      if (body) { body.style.transform = ''; body.style.filter = ''; }
      const runner = document.getElementById(`runner-${i}`);
      if (runner) runner.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))';
      const rank = document.getElementById(`rank-${i}`);
      if (rank) { rank.className = `rank-badge rank-${i+1}`; rank.textContent = ''; }
    });
  }

  function setRunnerPos(i, frac) {
    const runner = document.getElementById(`runner-${i}`);
    if (!runner) return;
    const lane = document.querySelector(`#track-${i} .lane-bg`);
    const laneW = lane ? lane.offsetWidth : 500;
    const px = 90 + frac * (laneW - 50);
    runner.style.left = px + 'px';
  }

  // ── Countdown ──────────────────────────────────────────
  function beginCountdown() {
    document.getElementById('action-btn').disabled = true;
    document.getElementById('arrival-log').innerHTML = '';

    // Reset rank badges
    players.forEach((_, i) => {
      const rank = document.getElementById(`rank-${i}`);
      if (rank) { rank.className = `rank-badge rank-${i+1}`; rank.textContent = ''; }
    });

    const overlay = document.getElementById('countdown-overlay');
    const numEl   = document.getElementById('countdown-number');

    let count = 3;
    overlay.classList.add('show');

    function tick() {
      numEl.style.animation = 'none';
      numEl.offsetHeight; // reflow to restart animation
      numEl.style.animation = 'countPop 0.9s ease-out';
      numEl.textContent = count > 0 ? count : 'GO!';
      numEl.style.color = count > 0 ? '#fff' : '#66ff99';

      if (count <= 0) {
        setTimeout(() => {
          overlay.classList.remove('show');
          goRace();
        }, 700);
      } else {
        count--;
        setTimeout(tick, 950);
      }
    }
    tick();
  }

  // ── Race ───────────────────────────────────────────────
  function goRace() {
    if (running) return;
    running  = true;
    finished = [];
    document.getElementById('race-status').textContent = '🦫 달리는 중...';

    baseTargetSpeeds = players.map(() => BASE_SPEED_MIN + Math.random() * (BASE_SPEED_MAX - BASE_SPEED_MIN));
    currentSpeeds    = players.map((_, i) => baseTargetSpeeds[i]);
    speedEvents      = players.map(() => null);
    positions        = players.map(() => 0);
    players.forEach((_, i) => setRunnerPos(i, 0));

    animFrameId = requestAnimationFrame(raceTick);
  }

  function raceTick() {
    let allDone = true;

    players.forEach((name, i) => {
      if (positions[i] >= 1) return;
      allDone = false;

      const prevSpeed = currentSpeeds[i];

      // ── Speed event countdown ──
      if (speedEvents[i]) {
        speedEvents[i].framesLeft--;
        if (speedEvents[i].framesLeft <= 0) speedEvents[i] = null;
      }

      // ── Random event trigger (burst or stumble) ──
      if (!speedEvents[i] && Math.random() < 0.004) {
        const type = Math.random() < 0.45 ? 'burst' : 'stumble';
        speedEvents[i] = {
          type,
          framesLeft: type === 'burst'
            ? 55 + Math.floor(Math.random() * 65)
            : 30 + Math.floor(Math.random() * 40)
        };
        showEventBubble(i, type);
      }

      // ── Compute target speed with micro-turbulence ──
      let target = baseTargetSpeeds[i] + (Math.random() - 0.5) * 0.00028;
      if (speedEvents[i]) {
        target *= speedEvents[i].type === 'burst' ? 2.6 : 0.18;
      }
      target = Math.max(SPEED_CAP_MIN, Math.min(SPEED_CAP_MAX, target));

      // ── Inertia: smooth acceleration toward target ──
      currentSpeeds[i] = currentSpeeds[i] * 0.92 + target * 0.08;

      positions[i] += currentSpeeds[i];

      if (positions[i] >= 1) {
        // ── Finished! ──
        positions[i] = 1;
        finished.push(i);
        setRunnerPos(i, 1);

        const place   = finished.length;
        const rank    = document.getElementById(`rank-${i}`);
        const medals  = ['🥇','🥈','🥉'];
        if (rank) {
          rank.className  = `rank-badge rank-${place} show`;
          rank.textContent = medals[place - 1] || place;
        }

        // Reset body animation on finish
        const body = document.getElementById(`runner-${i}`)?.querySelector('.cap-body');
        if (body) body.style.transform = '';
        const runner = document.getElementById(`runner-${i}`);
        if (runner) runner.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))';

        addArrivalLog(place, name);
      } else {
        setRunnerPos(i, positions[i]);

        // ── Lively body animation ──
        const t      = Date.now();
        const speed  = currentSpeeds[i];
        const accel  = speed - prevSpeed;

        // Bounce frequency proportional to speed (4–10 Hz range)
        const freq      = 0.002 + speed * 5;
        const bounceAmp = 2.5 + speed * 800;
        const bounce    = Math.sin(t * freq + i * 1.5) * bounceAmp;

        // Lateral sway (slower than bounce)
        const sway  = Math.sin(t * freq * 0.55 + i * 2.1) * 2.2;

        // Forward tilt from acceleration
        const tilt  = Math.max(-20, Math.min(20, accel * 90000 + sway));

        // Stretch when fast
        const stretchX = 1 + Math.max(0, (speed - 0.0009) * 110);
        const squishY  = 1 - Math.max(0, (speed - 0.0009) * 32);

        const body = document.getElementById(`runner-${i}`)?.querySelector('.cap-body');
        if (body) {
          body.style.transform = `translateY(${bounce}px) rotate(${tilt}deg) scaleX(${stretchX}) scaleY(${squishY})`;
        }

        // ── Glow based on event ──
        const runner = document.getElementById(`runner-${i}`);
        if (runner) {
          if (speedEvents[i]?.type === 'burst') {
            runner.style.filter = 'drop-shadow(0 0 12px rgba(255,210,0,0.95)) drop-shadow(0 2px 4px rgba(0,0,0,0.5))';
          } else if (speedEvents[i]?.type === 'stumble') {
            runner.style.filter = 'drop-shadow(0 0 10px rgba(255,70,70,0.9)) drop-shadow(0 2px 4px rgba(0,0,0,0.5))';
          } else {
            runner.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))';
          }
        }

        // ── Dust particles for fast runners ──
        if (speed > SPEED_CAP_MAX * 0.55 && Math.random() < 0.28) {
          spawnDust(i, positions[i]);
        }
      }
    });

    if (finished.length === players.length) allDone = true;

    if (!allDone) {
      animFrameId = requestAnimationFrame(raceTick);
    } else {
      running = false;
      document.getElementById('race-status').textContent = '🏁 결승!';
      setTimeout(() => showResult(finished[finished.length - 1]), 800);
    }
  }

  // ── Helpers ────────────────────────────────────────────
  function spawnDust(playerIndex, position) {
    const track = document.getElementById(`track-${playerIndex}`);
    if (!track) return;
    const lane  = track.querySelector('.lane-bg');
    const laneW = lane ? lane.offsetWidth : 500;
    const px    = 90 + position * (laneW - 50);

    const dust = document.createElement('div');
    dust.className = 'dust-particle';
    const symbols = ['💨', '·', '˙', '∘', '•'];
    dust.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    dust.style.left = (px - 16) + 'px';
    track.appendChild(dust);
    setTimeout(() => dust.remove(), 700);
  }

  function showEventBubble(playerIndex, type) {
    const runner = document.getElementById(`runner-${playerIndex}`);
    if (!runner) return;
    const bubble = document.createElement('div');
    bubble.className = 'event-bubble';
    if (type === 'burst') {
      bubble.textContent = '💨 스퍼트!';
      bubble.style.color = '#FFD700';
    } else {
      bubble.textContent = '😵 비틀!';
      bubble.style.color = '#FF6B6B';
    }
    runner.appendChild(bubble);
    setTimeout(() => bubble.remove(), 1500);
  }

  function addArrivalLog(place, name) {
    const medals = ['🥇','🥈','🥉'];
    const icon   = medals[place - 1] || `${place}위`;
    const log    = document.getElementById('arrival-log');
    log.innerHTML += `<div>${icon} ${place}등: <strong>${name}</strong></div>`;
  }

  function showResult(loserIndex) {
    document.getElementById('result-name').textContent = players[loserIndex];
    const orderLines = finished.map((idx, rank) => {
      const medals = ['🥇','🥈','🥉'];
      const icon   = medals[rank] || `${rank + 1}위`;
      return `${icon} ${players[idx]}`;
    });
    document.getElementById('result-order').innerHTML = orderLines.join('<br>');
    document.getElementById('result-overlay').classList.add('show');
  }

  function resetRace() {
    if (animFrameId) cancelAnimationFrame(animFrameId);
    document.getElementById('result-overlay').classList.remove('show');
    document.getElementById('setup-box').style.display = 'block';
    document.getElementById('game-area').style.display = 'none';
    document.querySelectorAll('.name-inputs input').forEach(i => i.value = '');
  }
</script>
</body>
</html>
